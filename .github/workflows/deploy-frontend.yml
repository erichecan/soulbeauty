name: Deploy to Cloud Run

on:
  push:
    branches: ["main"]
    paths:
      - "src/**"
      - "prisma/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "next.config.ts"
      - "Dockerfile"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      PROJECT_ID: soulbeauty-471203
      REGION: us-central1
      SERVICE_NAME: soulbeauty-web
      REGISTRY: us-central1-docker.pkg.dev/soulbeauty-471203/soulbeauty
      CLOUDSQL_INSTANCE: soulbeauty-471203:us-central1:soulbeauty-db
      RUNTIME_SA: soulbeauty-run@soulbeauty-471203.iam.gserviceaccount.com

    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build
        run: |
          docker build \
            -t ${{ env.REGISTRY }}/web:${GITHUB_SHA::8} \
            -t ${{ env.REGISTRY }}/web:latest \
            .

      - name: Push
        run: docker push --all-tags ${{ env.REGISTRY }}/web

      - name: Deploy
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image ${{ env.REGISTRY }}/web:${GITHUB_SHA::8} \
            --region ${{ env.REGION }} \
            --project ${{ env.PROJECT_ID }} \
            --service-account ${{ env.RUNTIME_SA }} \
            --allow-unauthenticated \
            --min-instances=0 --max-instances=5 \
            --memory=1Gi --cpu=1 \
            --add-cloudsql-instances ${{ env.CLOUDSQL_INSTANCE }} \
            --set-secrets="DATABASE_URL=database-url:latest" \
            --quiet

      - name: Verify
        run: |
          URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region ${{ env.REGION }} --project ${{ env.PROJECT_ID }} \
            --format="value(status.url)")
          echo "部署地址: $URL"
          for PAGE in "" "/services" "/booking" "/about" "/contact"; do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" "$URL$PAGE")
            echo "$PAGE -> HTTP $CODE"
            [ "$CODE" = "200" ] || exit 1
          done
          echo "✅ 全部页面 200"
